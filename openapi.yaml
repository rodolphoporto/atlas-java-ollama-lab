openapi: 3.1.0
info:
  title: ATLAS-JAVA-001 API
  version: 0.6.0
  description: API de estudo para conversar com modelos Ollama permitidos por resposta completa ou streaming SSE, com memória contextual, gerenciamento e métricas de inferência.
servers:
  - url: http://localhost:8080
paths:
  /api/ai/models:
    get:
      summary: Lista os modelos que podem ser selecionados com segurança
      operationId: listModels
      responses:
        '200':
          description: Modelo padrão e lista permitida configurada pela aplicação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
  /api/ai/chat:
    post:
      summary: Envia uma mensagem e aguarda a resposta completa
      operationId: chat
      description: Cria ou continua uma conversa e envia ao modelo uma janela limitada do histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Resposta completa do modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Mensagem inválida ou modelo fora da lista permitida
        '404':
          description: conversationId não encontrado
        '502':
          description: Falha antes de concluir a chamada ao Ollama
  /api/ai/chat/stream:
    post:
      summary: Envia uma mensagem e transmite a resposta por Server-Sent Events
      operationId: streamChat
      description: |
        Emite primeiro `conversation`, depois eventos `token` e termina com `done`.
        Depois que o streaming começa, falhas do Ollama são enviadas como evento `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Fluxo SSE com eventos token, done ou error
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                tokens:
                  value: |
                    event: conversation
                    data: {"conversationId":"11111111-1111-1111-1111-111111111111"}

                    event: token
                    data: {"model":"qwen3:4b-instruct","content":"Olá"}

                    event: done
                    data: {"model":"qwen3:4b-instruct","done":true,"metrics":{"timeToFirstTokenMs":95,"totalDurationMs":1180,"tokensPerSecond":103.5,"promptTokens":42,"completionTokens":122,"contextMessages":3,"contextCharacters":286}}

        '400':
          description: Mensagem inválida ou modelo fora da lista permitida
        '404':
          description: conversationId não encontrado
  /api/conversations:
    get:
      summary: Lista conversas por atualização mais recente
      responses:
        '200':
          description: Lista resumida de conversas
  /api/conversations/{id}:
    get:
      summary: Recupera uma conversa e suas mensagens
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Conversa encontrada }
        '404': { description: Conversa não encontrada }
    patch:
      summary: Renomeia uma conversa
      operationId: renameConversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: Conversa renomeada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400': { description: Título ausente, vazio ou maior que 100 caracteres }
        '404': { description: Conversa não encontrada }
    delete:
      summary: Exclui uma conversa e todas as suas mensagens
      operationId: deleteConversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Conversa excluída }
        '404': { description: Conversa não encontrada }
components:
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
        conversationId:
          type: [string, 'null']
          format: uuid
        model:
          description: Modelo permitido a usar; quando omitido, usa o modelo padrão.
          type: [string, 'null']
          maxLength: 100
    ModelsResponse:
      type: object
      required: [defaultModel, models]
      properties:
        defaultModel:
          type: string
        models:
          type: array
          minItems: 1
          items:
            type: string
    ChatResponse:
      type: object
      required: [model, answer, conversationId, metrics]
      properties:
        model:
          type: string
        answer:
          type: string
        conversationId:
          type: string
          format: uuid
        metrics:
          $ref: '#/components/schemas/InferenceMetrics'
    InferenceMetrics:
      type: object
      required: [timeToFirstTokenMs, totalDurationMs, tokensPerSecond, promptTokens, completionTokens, contextMessages, contextCharacters]
      properties:
        timeToFirstTokenMs:
          description: Tempo percebido até o primeiro fragmento no streaming; nulo na resposta não streaming.
          type: [integer, 'null']
          format: int64
        totalDurationMs:
          description: Duração ponta a ponta medida pela aplicação.
          type: integer
          format: int64
        tokensPerSecond:
          description: Velocidade de geração calculada com eval_count e eval_duration do Ollama.
          type: [number, 'null']
          format: double
        promptTokens:
          type: [integer, 'null']
        completionTokens:
          type: [integer, 'null']
        contextMessages:
          type: integer
        contextCharacters:
          type: integer
    RenameConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
    ConversationSummary:
      type: object
      required: [id, title, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
