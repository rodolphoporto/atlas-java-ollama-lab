services:
  postgres:
    image: postgres:18.6-alpine
    container_name: atlas-java-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_java}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  atlas-postgres-data:
