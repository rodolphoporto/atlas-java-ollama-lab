spring:
  application:
    name: atlas-java-ollama-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/atlas_java}
    username: ${DATABASE_USER:atlas}
    password: ${DATABASE_PASSWORD:atlas_local_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:qwen3:4b-instruct}
    connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:2s}
    read-timeout: ${OLLAMA_READ_TIMEOUT:120s}

